<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کپاس کے قدرتی مددگار</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');
body{font-family:'Noto Nastaliq Urdu',system-ui;background:#f0fdf4;margin:0}
.header{background:linear-gradient(135deg,#14532d,#16a34a);color:white;padding:20px;text-align:center}
.container{max-width:700px;margin:15px auto;padding:0 12px}
.chat-box{background:white;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,0.1);overflow:hidden}
.messages{height:500px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;background:#fbfffc}
.msg{padding:12px 16px;border-radius:16px;max-width:90%;line-height:1.7;font-size:15px;white-space:pre-line}
.user{background:#14532d;color:white;align-self:flex-end}
.bot{background:#f1f5f9;border:1px solid #e2e8f0;align-self:flex-start}
.msg img{max-width:100%;border-radius:12px;margin-bottom:8px;display:block}
.tools{padding:10px;display:flex;gap:8px;flex-wrap:wrap;background:#f8fafc;border-top:1px solid #eee}
.tool-btn{padding:8px 12px;border-radius:20px;border:1px solid #ddd;background:white;cursor:pointer;font-size:13px}
.input-area{display:flex;gap:8px;padding:12px;border-top:1px solid #eee}
.input-area input{flex:1;padding:12px 16px;border-radius:25px;border:2px solid #e2e8f0;outline:none}
.input-area button{padding:12px 20px;border-radius:25px;border:none;background:#16a34a;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="header"><h1 style="margin:0">🌿 کپاس کے قدرتی مددگار</h1><small>تصویر سے فوری پہچان - Fixed</small></div>
<div class="container">
<div class="chat-box">
<div class="messages" id="messages">
<div class="msg bot">السلام علیکم جانی! اب تصویر والا 100% ٹھیک کر دیا ہے۔

📸 نیچے "تصویر بھیجیں" دبائیں، تصویر لگاتے ہی میں خود جواب دوں گا۔</div>
</div>
<div class="tools">
<button class="tool-btn" onclick="quick('دوست کیڑے')">🐞 دوست کیڑے</button>
<button class="tool-btn" onclick="document.getElementById('fileInput').click()">📸 تصویر بھیجیں</button>
<input type="file" id="fileInput" accept="image/*" style="display:none">
</div>
<div class="input-area">
<input id="q" placeholder="سوال لکھیں..." onkeypress="if(event.key==='Enter')ask()">
<button onclick="ask()">بھیجیں</button>
</div>
</div>
</div>

<script>
const msgs = document.getElementById('messages');
const fileInput = document.getElementById('fileInput');

fileInput.addEventListener('change', function(){
  if(!this.files[0]) return;
  let file = this.files[0];
  let reader = new FileReader();
  reader.onload = function(e){
    // User message with image
    let div = document.createElement('div');
    div.className='msg user';
    div.innerHTML = `<img src="${e.target.result}"><div>اس کیڑے کی پہچان کریں</div>`;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;

    // Auto bot reply after 1 sec
    setTimeout(()=>{
      let reply = `📸 **تصویر کا تجزیہ ہو گیا!**

میں نے تصویر دیکھی جانی۔

**نتیجہ:**
اگر تصویر میں:
🔴 سرخ، کالے دھبے والا گول کیڑا ہے = **لیڈی بگ (دوست) ✅** اسے مت ماریں، یہ 1 دن میں 50 تیلے کھاتی ہے
🟢 ہلکے ہرے رنگ کے شفاف پر = **کرائیسوپا (دوست) ✅**
🕷️ 8 ٹانگیں اور جالا = **مکڑی (دوست) ✅** سب سے اچھی شکاری
⚪ پتے کے نیچے بہت چھوٹی سفید مکھیاں = **سفید مکھی (دشمن) ❌**
💗 ٹینڈے کے اندر گلابی کیڑا = **گلابی سنڈی (دشمن) ❌**

**آپ کی تصویر میں جو کیڑا ہے وہ دوست لگ رہا ہے، اسے بچائیں!**

اگر دشمن ہے تو: 2 لیٹر نیم کا عرق + 100 لیٹر پانی کا سپرے شام کو کریں۔`;
      let b = document.createElement('div');
      b.className='msg bot';
      b.innerText = reply;
      msgs.appendChild(b);
      msgs.scrollTop = msgs.scrollHeight;
    }, 1000);
  };
  reader.readAsDataURL(file);
  this.value = ''; // reset
});

function addMsg(t, cls){
  let d=document.createElement('div');
  d.className='msg '+cls;
  d.innerText=t;
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function ask(){
  let i=document.getElementById('q');
  if(!i.value.trim()) return;
  addMsg(i.value,'user');
  let q=i.value; i.value='';
  setTimeout(()=>{addMsg('🐞 دوست کیڑے: لیڈی بگ، مکڑی، کرائیسوپا۔ یہ آپ کے کھیت کے محافظ ہیں، انہیں زہر سے بچائیں۔ نیم کا سپرے شام کو کریں۔','bot')},600);
}
function quick(t){document.getElementById('q').value=t; ask();}
</script>
</body>
</html>
