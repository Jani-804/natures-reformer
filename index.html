<!DOCTYPE html>
<html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nature Reformer - Fresh</title>
<style>
body{margin:0;font-family:system-ui;background:#f9fdf6;color:#1a2e1a}
header{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #ddd;position:sticky;top:0}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:46px}
.hero{background:linear-gradient(135deg,#1b5e20,#66bb6a);color:#fff;text-align:center;padding:48px 18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;padding:20px;max-width:1000px;margin:auto}
.card{background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06);border:1px solid #e8f5e9;cursor:pointer}
.card:hover{transform:translateY(-4px)}
.chat{max-width:760px;margin:20px auto;background:#fff;border-radius:22px;padding:16px;border:1px solid #c5e1a5}
#msgs{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.bubble{padding:12px 16px;border-radius:18px;max-width:85%;font-size:14px}
.user{align-self:flex-end;background:#2e7d32;color:#fff}
.bot{align-self:flex-start;background:#f1f8e9;border:1px solid #dcedc8}
.row{display:flex;gap:8px;margin-top:12px}
.row input{flex:1;padding:14px;border-radius:30px;border:1px solid #c5e1a5;outline:none}
.row button{background:#1b5e20;color:#fff;border:none;width:50px;border-radius:50%;font-size:20px}
</style></head><body>
<header><div class="logo"><img src="logo.png"><b>NATURE REFORMER</b></div><span style="background:#e8f5e9;padding:6px 12px;border-radius:20px;font-size:12px">● LIVE</span></header>
<div class="hero"><h1>قدرتی کاشتکاری کا نیا دور</h1><p>نیا فریش ڈیزائن + لوگو، 8 ماڈیولز</p></div>
<div class="grid" id="grid"></div>
<div class="chat"><div id="msgs"><div class="bubble bot">السلام علیکم جانی! نیا ڈیزائن تیار ہے، لوگو لگ گیا ہے۔</div></div>
<div class="row"><input id="q" placeholder="سوال لکھیں..."><button onclick="ask()">➤</button></div></div>
<script>
const mods=[{i:"🏜️",t:"تھل و ساحل",k:"thal"},{i:"🌱",t:"زمین کی صحت",k:"soil"},{i:"💧",t:"پانی کا نظام",k:"water"},{i:"🐞",t:"مفید کیڑے",k:"insects"},{i:"🚫",t:"زہر سے بچاؤ",k:"pest"},{i:"🌦️",t:"موسم",k:"climate"},{i:"🌳",t:"درخت و جنگل",k:"forest"},{i:"♻️",t:"ریفارمر کھاد",k:"fert"}];
const kb={thal:"تھل/ساحل: جنتر، گوار، باجرہ + ملچ + ریفارمر 10 کلو/ایکڑ۔ PARC 2023",soil:"زمین: گوبر+بائیو چار، pH 6.5، ملچ۔ FAO",water:"پانی: ڈرپ+رات کو پانی+ملچ=60% بچت۔ PCRWR",insects:"مفید کیڑے بچائیں، نیم سپرے۔ CABI",pest:"نیم، لہسن، مرچ، راکھ۔ NARC",climate:"خشک فصلیں، ونڈ بریک۔ IPCC",forest:"کیکر، بیری، شیشم۔ Forest Dept",fert:"ریفارمر مائیکروبز والی، +40% پیداوار۔"};
const g=document.getElementById('grid');
mods.forEach(m=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div style="font-size:30px">${m.i}</div><h3>${m.t}</h3>`;d.onclick=()=>{document.getElementById('q').value=m.t;ask(m.k)};g.appendChild(d);});
function add(t,c){let d=document.createElement('div');d.className='bubble '+c;d.innerText=t;document.getElementById('msgs').appendChild(d);}
function ask(k=""){let inp=document.getElementById('q');let q=k||inp.value.trim();if(!q)return;add(q,'user');inp.value='';setTimeout(()=>{let a=kb[k]||`"${q}" پر: قدرتی طریقہ، ملچ+ریفارمر۔ حوالہ: Nature Reformer v3 LIVE`;add(a,'bot');},500);}
</script></body></html>
