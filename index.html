<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nature Reformer AI Hub</title><style>:root{--f:#173d2b;--bg:#fbfaf4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:sans-serif}.nav{display:flex;justify-content:space-between;padding:14px 5%;background:#fff;border-bottom:1px solid #ddd}.hero{padding:30px 5%}.chat{background:#fff;border:1px solid #ddd;border-radius:18px;max-width:600px;padding:15px}.msgs{height:300px;overflow:auto;display:flex;flex-direction:column;gap:10px}.b{padding:10px 12px;border-radius:12px;max-width:90%}.bot{background:#eaf4e8}.user{background:var(--f);color:#fff;align-self:flex-end}form{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:12px;border-radius:99px;border:1px solid #ccc}button{border:0;background:var(--f);color:#fff;border-radius:99px;padding:0 18px;font-weight:700}</style></head><body><div class="nav"><b>🌿 Nature Reformer</b><span style="background:#dff3d7;padding:4px 8px;border-radius:99px;font-size:12px">LIVE</span></div><div class="hero"><h2>Rebuild Nature. Rethink Agriculture.</h2><div class="chat"><div class="msgs" id="msgs"><div class="b bot">Hello Jani! Ask me about nature, climate or farming. اردو میں بھی پوچھ سکتے ہو۔</div></div><form id="f"><input id="q" placeholder="Ask something..." required><button>Send</button></form></div></div>
<script>
const WORKER="https://rapid-mode-aa7d.microdeepnature.workers.dev";
const msgs=document.getElementById('msgs');
const f=document.getElementById('f');
const q=document.getElementById('q');
function add(t,c){let d=document.createElement('div');d.className='b '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
f.addEventListener('submit',async e=>{
e.preventDefault();let txt=q.value.trim();if(!txt)return;
add(txt,'user');q.value='';let ty=add('Thinking...','bot');
try{let r=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:txt,language:txt.match(/[\u0600-\u06FF]/)?'ur':'en'})});let j=await r.json();ty.remove();add(j.answer||j.response||'No answer','bot')}catch{ty.remove();add('Connection failed, check Worker','bot')}
});
</script></body></html>
