<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Reformer AI V6 - DG Khan - V7 Upgraded</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0f172a;color:#e2e8f0}
.header{height:78px;background:linear-gradient(90deg,#14532d,#16a34a);display:flex;align-items:center;padding:0 16px;justify-content:space-between}
.logo{display:flex;gap:14px;align-items:center;font-weight:bold}
.logo img{height:62px;width:62px;border-radius:50%}
.main{display:flex;min-height:calc(100vh - 78px)}
.side{width:290px;background:#1e293b;padding:12px}
.item{padding:11px;border-radius:10px;margin-bottom:8px;cursor:pointer;background:#0f172a}
.item.active{background:#16a34a;color:#fff}
.content{flex:1;padding:14px;display:flex;flex-direction:column}
#chatBox{flex:1;overflow-y:auto}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:85%}
.user{background:#1e40af;align-self:flex-end}
.ai{background:#1e293b}
.inputArea{display:flex;gap:8px;margin-top:10px;background:#1e293b;padding:10px;border-radius:12px}
.inputArea input{flex:1;background:transparent;border:none;color:white;outline:none;font-size:16px}
.inputArea button{border:none;background:#16a34a;color:white;padding:10px 14px;border-radius:8px}
.live{font-size:12px;background:#0f172a;padding:8px;border-radius:8px;margin-bottom:10px}
</style>
</head>
<body>
<div class="header">
  <div class="logo"><img src="https://i.imgur.com/8Km9tLL.png"> Nature Reformer AI V6</div>
  <div id="liveWeather">📍 DG Khan - Loading...</div>
</div>
<div class="main">
  <div class="side">
    <div class="live" id="weatherBox">Weather: --<br>Soil: --<br>Market: Cotton 8500 PKR</div>
    <div class="item active" onclick="clearHistory()">🗑️ Clear History</div>
    <div class="item">🌾 DG Khan Crops</div>
    <div class="item">🌧️ Weather Update</div>
  </div>
  <div class="content">
    <div id="chatBox"></div>
    <div class="inputArea">
      <input id="userInput" placeholder="Sawal likhein... / Ask question">
      <button id="micBtn">🎤</button>
      <button id="sendBtn">↑</button>
    </div>
  </div>
</div>

<script>
// ===== 2. USER LOCATION DETECTION - FIXED =====
let userLocation = { lat: 30.05, lon: 70.64 };
function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition((pos)=>{
      userLocation.lat = pos.coords.latitude;
      userLocation.lon = pos.coords.longitude;
      localStorage.setItem('dg_lat', userLocation.lat);
      localStorage.setItem('dg_lon', userLocation.lon);
      getRealTimeData(userLocation.lat, userLocation.lon);
    });
  }
}

// ===== 1. REAL-TIME API INTEGRATION =====
async function getRealTimeData(lat, lon){
  try{
    let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m&hourly=soil_temperature_0_to_7cm,soil_moisture_0_to_7cm`);
    let data = await res.json();
    let temp = data.current.temperature_2m;
    document.getElementById('liveWeather').innerText = `📍 ${temp}°C DG Khan`;
    document.getElementById('weatherBox').innerHTML = `🌡️ ${temp}°C<br>🌱 Soil: ${data.hourly.soil_temperature_0_to_7cm[0]}°C<br>💧 Moisture: ${data.hourly.soil_moisture_0_to_7cm[0]}`;
    localStorage.setItem('real_data', JSON.stringify(data));
  }catch(e){
    console.log("API error", e);
  }
}

// ===== 4. SAVE CHAT HISTORY =====
function saveChat(msg, who){
  let chats = JSON.parse(localStorage.getItem('natures_chats')||'[]');
  chats.push({msg, who});
  localStorage.setItem('natures_chats', JSON.stringify(chats));
}
function loadChats(){
  let chats = JSON.parse(localStorage.getItem('natures_chats')||'[]');
  chats.forEach(c=> addMsg(c.msg, c.who, false));
}
function clearHistory(){
  localStorage.removeItem('natures_chats');
  document.getElementById('chatBox').innerHTML="";
}
function addMsg(text, who, save=true){
  let div = document.createElement('div');
  div.className = `msg ${who}`;
  div.innerText = text;
  document.getElementById('chatBox').appendChild(div);
  if(save) saveChat(text, who);
}

// ===== 3. VOICE INPUT =====
const micBtn = document.getElementById('micBtn');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
  const rec = new SpeechRecognition();
  rec.lang = 'ur-PK';
  micBtn.onclick = ()=>{ rec.start(); micBtn.innerText="🔴"; };
  rec.onresult = (e)=>{
    document.getElementById('userInput').value = e.results[0][0].transcript;
    micBtn.innerText="🎤";
  };
  rec.onerror = ()=> micBtn.innerText="🎤";
}

// Simple send function - you can connect OpenRouter here
document.getElementById('sendBtn').onclick = ()=>{
  let input = document.getElementById('userInput');
  if(!input.value) return;
  addMsg(input.value, 'user');
  input.value="";
  setTimeout(()=> addMsg("Ye feature ab connected hai. OpenRouter key add karein to AI jawab dega.", 'ai'), 500);
};

// Init on load
window.onload = ()=>{ getLocation(); loadChats(); getRealTimeData(userLocation.lat, userLocation.lon); };
</script>
</body>
</html>
