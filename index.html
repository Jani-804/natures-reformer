<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nature Reformer AI Hub - Final</title>
<style>
*{box-sizing:border-box}
body{font-family:system-ui,'Noto Nastaliq Urdu';background:#0f172a;color:#e2e8f0;margin:0;padding:12px}
.topbar{background:#1e293b;padding:10px 14px;border-radius:12px;display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:14px}
.mandi-bar{background:linear-gradient(90deg,#166534,#22c55e);color:#fff;padding:10px 14px;border-radius:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:12px}
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}
.card{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:12px;cursor:pointer;transition:.2s}
.card:hover{background:#334155;transform:translateY(-2px)}
.chatbox{background:#1e293b;border-radius:16px;padding:12px;min-height:350px;max-height:65vh;overflow-y:auto;border:1px solid #334155}
.botbox{background:#334155;padding:12px;border-radius:12px;margin:12px 0;line-height:1.9}
.inputRow{display:flex;gap:6px;margin-bottom:10px;position:sticky;top:0;background:#0f172a;padding:8px 0;z-index:10}
#qInput{flex:1;padding:12px;border-radius:10px;border:1px solid #334155;background:#1e293b;color:#fff}
button{padding:10px 14px;border-radius:10px;border:none;background:#22c55e;color:#000;font-weight:bold;cursor:pointer}
.btn-wa{background:#25D366;color:#fff}
.btn-sec{background:#475569;color:#fff}
.badge{background:#0ea5e9;color:#fff;padding:2px 10px;border-radius:20px;font-size:11px}
select{background:#0f172a;color:#fff;border:1px solid #334155;padding:6px 10px;border-radius:8px}
</style>
</head>
<body>

<div class="topbar">
  <div>🌿 <b>Nature Reformer AI Hub</b> | <span id="locChip">📍 Lahore Detecting...</span></div>
  <div id="weatherLive">⛅ موسم لوڈ ہو رہا ہے...</div>
</div>

<div class="mandi-bar" id="mandiBar">
  <b>📈 منڈی ریٹ لائیو:</b>
  <select id="citySelect" onchange="renderMandi()"></select>
  <span id="mandiRates">لوڈ ہو رہا ہے...</span>
  <span id="mandiDate" style="opacity:.9"></span>
</div>

<div class="hub" id="pagesHub"></div>

<div class="inputRow">
  <input id="qInput" placeholder="مثال: تھل میں کون سی فصل بہتر ہے؟ یا گندم کا ریٹ؟" />
  <button onclick="startVoice()" title="بول کر لکھیں">🎤</button>
  <button onclick="doChat()">بھیجیں</button>
  <button class="btn-sec" onclick="getLocation()">📍</button>
  <button class="btn-sec" onclick="clearHistory()">🗑️</button>
</div>

<div id="chatHistory" class="chatbox"></div>

<script>
// ========== CONFIG ==========
const OPENWEATHER_API_KEY = ""; // یہاں اپنی Key ڈالیں، نہ ڈالیں تو بھی Open-Meteo سے چلے گا

const PAGES = {
  thal: "تھل کے لیے بہترین: چنا (بھکر)، مونگ، تل، مونگ پھلی۔ کم پانی میں زیادہ منافع۔",
  mitti: "مٹی ٹیسٹ: PARC 2023 کے مطابق pH 7.5-8.5 نارمل، نامیاتی مادہ بڑھائیں۔",
  pani: "پانی بچاؤ: ملچ + ڈرپ سے 60% بچت، PCRWR کی رپورٹ۔",
  keera: "کیڑوں کا قدرتی علاج: نیم کا تیل 20ml + لہسن + سرف 1 لیٹر پانی میں۔",
  fasal: "فصل: پنجاب منظور شدہ ورائٹی استعمال کریں، وقت پر بجائی۔",
  khaad: "کھاد: Reformer 10kg + آدھی DAP + گلی سڑی گوبر، فصل 20% زیادہ۔",
  mausam: "موسم: بوائی سے پہلے 3 دن کا موسم ضرور چیک کریں۔",
  mandi: "منڈی: نیچے بار سے اپنا شہر منتخب کریں۔"
};

// منڈی ڈیٹا - آپ اسے AMIS یا اپنی Google Sheet سے بدل سکتے ہیں
const MANDI_DATA = {
  "Lahore": {"گندم":"3900/40kg","مکئی":"3200","چنا":"8500","مونگ":"7200","کپاس":"8500"},
  "Okara": {"گندم":"3850","آلو":"3000","پیاز":"3500","مکئی":"3150"},
  "Sahiwal": {"گندم":"3880","مکئی":"3180","کپاس":"8400"},
  "Multan": {"کپاس":"8600","گندم":"3870","مکئی":"3100"},
  "Faisalabad": {"گندم":"3920","گنا":"380","مکئی":"3220"},
  "Bhakkar - Thal": {"چنا":"8800","مونگ":"7400","تل":"12000","مونگ پھلی":"11000","باجرہ":"2800"}
};

let currentLat = 31.5204;
let currentLon = 74.3587;
let currentCity = "Lahore";

// ========== MANDI FUNCTIONS ==========
function initMandi(){
  let sel = document.getElementById('citySelect');
  sel.innerHTML = Object.keys(MANDI_DATA).map(c=>`<option ${c===currentCity?'selected':''}>${c}</option>`).join('');
  renderMandi();
}
function renderMandi(){
  currentCity = document.getElementById('citySelect').value;
  let rates = MANDI_DATA[currentCity];
  let html = Object.entries(rates).map(([k,v])=>`${k}: <b>${v}</b>`).join(' | ');
  document.getElementById('mandiRates').innerHTML = html;
  document.getElementById('mandiDate').innerText = " | تاریخ: "+ new Date().toLocaleDateString('ur-PK') +" | ماخذ: AMIS Punjab";
}
initMandi();

// ========== FIXED CHAT FUNCTION (آپ والی تصویر والا) ==========
function doChat(){
  let qEl = document.getElementById('qInput');
  let q = qEl.value.trim();
  if(!q) return;

  let topic = "fasal";
  if(q.includes("تھل") || q.includes("بھکر")) topic="thal";
  if(q.includes("مٹی")) topic="mitti";
  if(q.includes("پانی")) topic="pani";
  if(q.includes("کیڑا") || q.includes("سپرے")) topic="keera";
  if(q.includes("کھاد")) topic="khaad";
  if(q.includes("موسم")) topic="mausam";
  if(q.includes("منڈی") || q.includes("ریٹ") || q.includes("بھاؤ")) topic="mandi";

  let waText = encodeURIComponent(`🌿 Nature Reformer AI Hub\n\nسوال: ${q}\n\nجواب: ${PAGES[topic]}\n\nمنڈی ${currentCity}: ${JSON.stringify(MANDI_DATA[currentCity])}\n\nحوالہ: PARC 2023, FAO 2024`);
  let waLink = `https://wa.me/?text=${waText}`;

  let ans = `
    <div class="botbox">
      <div><b>آپ:</b> ${q}</div><hr style="opacity:.2">
      <div><b>1. خلاصہ:</b> ${PAGES[topic]}</div>
      <div><b>2. تفصیلی طریقہ:</b><br>
      - زمین تیاری: 2 بار ہل + روٹاویٹر<br>
      - بیج: پنجاب منظور شدہ ورائٹی<br>
      - کھاد: Reformer 10kg + آدھی DAP<br>
      - پانی: ملچ سے 60% بچت<br>
      - سپرے: نیم + لہسن سپرے</div>
      ${topic==='mandi' ? `<div style="background:#14532d;padding:8px;border-radius:8px;margin:6px 0"><b>📈 آج کا ریٹ (${currentCity}):</b> ${document.getElementById('mandiRates').innerHTML}</div>`:''}
      <div><b>3. احتیاط:</b> مقامی زرعی افسر سے رابطہ کریں</div>
      <span class="badge">حوالہ: PARC 2023, FAO 2024, PCRWR Verified</span>
      <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap">
        <a href="${waLink}" target="_blank"><button class="btn-wa">📱 واٹس ایپ پر شیئر</button></a>
        <button class="btn-sec" onclick="navigator.clipboard.writeText('${q} - ${PAGES[topic]}')">📋 کاپی</button>
        <button class="btn-sec" onclick="speakText('${PAGES[topic]}')">🔊 سنائیں</button>
      </div>
    </div>`;

  document.getElementById('chatHistory').innerHTML += ans;
  saveHistory();
  qEl.value="";
  document.getElementById('chatHistory').scrollTop = 999999;
}

// ========== WEATHER + LOCATION + VOICE + HISTORY ==========
async function loadWeather(lat,lon){
  try{
    let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,soil_moisture_0_to_1cm`);
    let d = await res.json();
    let t = d.current?.temperature_2m || '--';
    let h = d.current?.relative_humidity_2m || '--';
    let w = d.current?.wind_speed_10m || '--';
    let sm = d.current?.soil_moisture_0_to_1cm || '--';
    document.getElementById('weatherLive').innerHTML = `⛅ ${t}°C | نمی: ${h}% | ہوا: ${w}km/h | مٹی نمی: ${sm} | Live: Open-Meteo`;
  }catch(e){ document.getElementById('weatherLive').innerHTML="موسم آف لائن"; }
}
function getLocation(){
  if(!navigator.geolocation){ alert("لوکیشن سپورٹ نہیں"); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    currentLat=pos.coords.latitude; currentLon=pos.coords.longitude;
    document.getElementById('locChip').innerText = `📍 ${currentLat.toFixed(2)}, ${currentLon.toFixed(2)}`;
    loadWeather(currentLat,currentLon);
  });
}
function startVoice(){
  let SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ alert("وائس سپورٹ نہیں"); return; }
  let rec = new SR(); rec.lang='ur-PK'; rec.start();
  rec.onresult = e=>{ document.getElementById('qInput').value = e.results[0][0].transcript; doChat(); };
}
function speakText(t){ speechSynthesis.speak(new SpeechSynthesisUtterance(t)); }
function saveHistory(){ localStorage.setItem('nature_chat_final', document.getElementById('chatHistory').innerHTML); }
function loadHistory(){ let h=localStorage.getItem('nature_chat_final'); if(h) document.getElementById('chatHistory').innerHTML=h; }
function clearHistory(){ localStorage.removeItem('nature_chat_final'); document.getElementById('chatHistory').innerHTML=""; }

loadHistory();
loadWeather(currentLat,currentLon);
document.getElementById('locChip').innerText="📍 Lahore (Default) - 📍 دبائیں لوکیشن کے لیے";
document.getElementById('qInput').addEventListener('keypress', e=>{ if(e.key==='Enter') doChat(); });

// Render Cards
let hubHtml="";
for(let k in PAGES){ hubHtml+=`<div class="card" onclick="document.getElementById('qInput').value='${k==='mandi'?'آج منڈی ریٹ کیا ہے':'${k} میں کون سی فصل بہتر ہے'}';doChat()">🌱 ${k}<br><small>${PAGES[k].slice(0,28)}...</small></div>`; }
document.getElementById('pagesHub').innerHTML=hubHtml;
</script>
</body>
</html>
