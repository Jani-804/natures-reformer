let userLocation = { lat: 30.05, lon: 70.64, name: "DG Khan" };

function getLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      userLocation.lat = pos.coords.latitude;
      userLocation.lon = pos.coords.longitude;
      localStorage.setItem('dg_lat', userLocation.lat);
      localStorage.setItem('dg_lon', userLocation.lon);
      getRealTimeData(userLocation.lat, userLocation.lon);
    }, ()=>{
      getRealTimeData(userLocation.lat, userLocation.lon);
    });
  } else {
    getRealTimeData(userLocation.lat, userLocation.lon);
  }
}

async function getRealTimeData(lat, lon){
  try{
    let res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m&hourly=soil_temperature_0_to_7cm,soil_moisture_0_to_7cm&timezone=auto`);
    let data = await res.json();
    let temp = data.current.temperature_2m;
    let soilT = data.hourly.soil_temperature_0_to_7cm[0];
    let soilM = data.hourly.soil_moisture_0_to_7cm[0];
    document.getElementById('liveWeather').innerText = `📍 ${temp}°C - DG Khan`;
    document.getElementById('weatherBox').innerHTML = `🌡️ Weather: ${temp}°C<br>💧 Humidity: ${data.current.relative_humidity_2m}%<br>🌱 Soil: ${soilT}°C<br>💧 Moisture: ${soilM}<br>📈 Market: Cotton 8500 PKR/40kg`;
    localStorage.setItem('real_data', JSON.stringify({temp, humidity: data.current.relative_humidity_2m, soilT, soilM}));
  }catch(e){
    document.getElementById('liveWeather').innerText = "📍 DG Khan - Offline";
  }
}

// ===== CHAT HISTORY =====
const chatBox = document.getElementById('chatBox');
function addMsg(text, who, save=true){
  let div = document.createElement('div');
  div.className = `msg ${who}`;
  div.innerText = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  if(save){
    let chats = JSON.parse(localStorage.getItem('natures_chats_v7')||'[]');
    chats.push({msg:text, who});
    if(chats.length>100) chats.shift();
    localStorage.setItem('natures_chats_v7', JSON.stringify(chats));
  }
}
function loadChats(){
  let chats = JSON.parse(localStorage.getItem('natures_chats_v7')||'[]');
  if(chats.length===0){
    addMsg("Assalam-o-Alaikum! Main Local Keep AI hoon. DG Khan ke kisan ke liye bana hua. Mausam, zameen, aur fasal ke bare mein poochein.", 'ai', false);
  } else {
    chats.forEach(c=> addMsg(c.msg, c.who, false));
  }
}
function clearHistory(){
  localStorage.removeItem('natures_chats_v7');
  chatBox.innerHTML="";
  addMsg("Chat history cleared.", 'ai', false);
}
