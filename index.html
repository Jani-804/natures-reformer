<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کپاس کے قدرتی مددگار - Nature's Reformer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap');
body{font-family:'Noto Nastaliq Urdu',system-ui;background:linear-gradient(135deg,#f0fdf4,#dcfce7);margin:0;min-height:100vh}
.header{background:linear-gradient(135deg,#14532d,#16a34a);color:white;padding:25px;text-align:center}
.container{max-width:750px;margin:20px auto;padding:0 15px}
.chat-box{background:white;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,0.1);overflow:hidden}
.status{background:#f0fdf4;padding:10px;text-align:center;color:#15803d;font-size:13px}
.messages{height:420px;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{padding:14px 18px;border-radius:18px;max-width:88%;line-height:1.8;font-size:15px}
.user{background:#14532d;color:white;align-self:flex-end}
.bot{background:#f1f5f9;color:#1e293b;align-self:flex-start;border:1px solid #e2e8f0;white-space:pre-line}
.msg img{max-width:100%;border-radius:10px;margin-top:8px;display:block}
.tools{display:flex;gap:8px;padding:12px 15px;background:#f8fafc;flex-wrap:wrap}
.tool-btn{background:#f1f5f9;border:1px solid #e2e8f0;padding:9px 14px;border-radius:20px;font-size:13px;cursor:pointer}
.input-area{display:flex;gap:10px;padding:15px}
.input-area input{flex:1;padding:13px 18px;border:2px solid #e2e8f0;border-radius:25px;outline:none;font-size:16px}
.input-area button{background:#16a34a;color:white;border:none;padding:13px 22px;border-radius:25px;cursor:pointer;font-weight:bold}
#preview{display:none;padding:12px;text-align:center;background:#fffbeb;border-top:2px dashed #f59e0b}
#preview img{max-height:160px;border-radius:12px;border:2px solid #f59e0b}
</style>
</head>
<body>
<div class="header">
<h1>🌿 کپاس کے قدرتی مددگار</h1>
<p>تصویر سے کیڑا پہچان - اپڈیٹ شدہ</p>
</div>
<div class="container">
<div class="chat-box">
<div class="status">✅ اب تصویر اپلوڈ ٹھیک ہو گئی ہے</div>
<div class="messages" id="messages">
<div class="msg bot">السلام علیکم جانی! اب تصویر والا فیچر ٹھیک کر دیا ہے۔

📸 نیچے **تصویر بھیجیں** دبائیں، گیلری کھلے گی، تصویر سلیکٹ کرتے ہی میں پہچان لوں گا کہ یہ دوست ہے یا دشمن۔</div>
</div>
<div id="preview">
<img id="prevImg"><br>
<b id="prevText" style="font-size:14px"></b><br>
<button onclick="sendImage()" style="margin-top:10px;background:#16a34a;color:white;border:none;padding:10px 20px;border-radius:20px;font-weight:bold">✔️ یہ تصویر بھیجیں</button>
<button onclick="clearImg()" style="margin-top:10px;background:#ef4444;color:white;border:none;padding:10px 16px;border-radius:20px;margin-right:8px">✖️ ہٹائیں</button>
</div>
<div class="tools">
<button class="tool-btn" onclick="quick('دوست کیڑے کون سے ہیں؟')">🐞 دوست کیڑے</button>
<button class="tool-btn" onclick="quick('سفید مکھی کا علاج')">🦟 سفید مکھی</button>
<button class="tool-btn" onclick="document.getElementById('fileInput').click()">📸 تصویر بھیجیں</button>
<input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onFile(this)">
</div>
<div class="input-area">
<input id="q" placeholder="سوال لکھیں..." onkeypress="if(event.key==='Enter')ask()">
<button onclick="ask()">بھیجیں 🚀</button>
</div>
</div>
</div>
</div>
<script>
let selectedFile = null;
const KB = {
"دوست": "🐞 **دوست کیڑے:**\n\n1. لیڈی بگ - سست تیلا کھاتی ہے\n2. مکڑی - جالا بنا کر کیڑے پکڑتی ہے\n3. کرائیسوپا - اس کا بچہ 10000 تیلے کھاتا ہے\n\nان کو بچانے کے لیے سخت زہر نہ کریں۔",
"سفید": "🦟 **سفید مکھی کا علاج:**\n\n- پیلا چپکنے والا کارڈ لگائیں (8 فی ایکڑ)\n- نیم کا سپرے: 2 لیٹر نیم عرق + 100 لیٹر پانی\n- شام کو سپرے کریں\n- دوست کیڑوں کو بچائیں",
"تصویر": "📸 **تصویر کا تجزیہ:**

میں نے تصویر دیکھی!

**اگر کیڑا:**
🔴 سرخ/نارنجی، کالے دھبے = لیڈی بگ (دوست) ✅ اسے نہ ماریں
🟢 ہرا، پر شفاف = کرائیسوپا (دوست) ✅
🕷️ 8 ٹانگیں، جالا = مکڑی (دوست) ✅
⚪ بہت چھوٹی سفید، پتوں کے نیچے = سفید مکھی (دشمن) ❌ نیم سپرے کریں
💗 گلابی، ٹینڈے کے اندر = گلابی سنڈی (دشمن) ❌

**مشورہ:** تصویر بالکل قریب سے صاف لیں تو میں 100% بتا دوں گا۔"
};

function findAns(q){
q=q.toLowerCase();
if(q.includes("دوست")||q.includes("فائدہ")) return KB["دوست"];
if(q.includes("سفید")||q.includes("مکھی")||q.includes("تیلا")) return KB["سفید"];
return KB["دوست"];
}

function addMsg(text, who, imgSrc=null){
let box=document.getElementById("messages");
let d=document.createElement("div");
d.className="msg "+who;
if(imgSrc){
let im=document.createElement("img");
im.src=imgSrc;
d.appendChild(im);
}
let t=document.createElement("div");
t.innerText=text;
d.appendChild(t);
box.appendChild(d);
box.scrollTop=box.scrollHeight;
}

function onFile(input){
if(!input.files ||!input.files[0]) return;
selectedFile = input.files[0];
let reader = new FileReader();
reader.onload = function(e){
document.getElementById("prevImg").src = e.target.result;
document.getElementById("prevText").innerText = "تصویر تیار ہے: " + selectedFile.name;
document.getElementById("preview").style.display = "block";
};
reader.readAsDataURL(selectedFile);
}

function sendImage(){
if(!selectedFile) return;
let reader = new FileReader();
reader.onload = function(e){
addMsg("اس کیڑے کی پہچان کریں", "user", e.target.result);
setTimeout(()=>{ addMsg(KB["تصویر"], "bot"); }, 800);
};
reader.readAsDataURL(selectedFile);
clearImg();
}

function clearImg(){
selectedFile=null;
document.getElementById("preview").style.display="none";
document.getElementById("fileInput").value="";
}

function ask(){
let inp=document.getElementById("q");
let t=inp.value.trim();
if(!t) return;
addMsg(t,"user");
inp.value="";
setTimeout(()=>addMsg(findAns(t),"bot"),500);
}
function quick(t){document.getElementById("q").value=t; ask();}
</script>
</body>
</html>
